{% extends 'layouts/admin.html' %}{% block content %}<p>Private preview · {{ 'Published' if project.published else 'Draft' }}</p><h1>{{ project.title }}</h1><p>{{ project.description }}</p><p>{{ project.technologies }}</p>{% if project.image %}<img class="preview-cover" src="{{ url_for('static',filename=project.image) }}" alt="{{ project.title }} cover">{% endif %}{% for path in project.screenshots %}<img class="preview-cover" src="{{ url_for('static',filename=path) }}" alt="{{ project.title }} screenshot {{ loop.index }}">{% endfor %}{% endblock %}
