{% extends 'layouts/admin.html' %}{% block content %}<a href="{{ url_for('admin_dashboard') }}">← All projects</a><h1>{{ 'Edit' if project.id else 'Add' }} project</h1><form method="post" enctype="multipart/form-data" class="editor-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Project title<input name="title" maxlength="120" value="{{ project.title|default('') }}" required></label><label>Description<textarea name="description" rows="5" maxlength="5000" required>{{ project.description|default('') }}</textarea></label><label>Technologies <small>Separate with commas</small><input name="technologies" value="{{ project.technologies|default('') }}" placeholder="Flask, Python, SQLite"></label><label>GitHub URL <small>Optional</small><input type="url" name="github" value="{{ project.github|default('') }}"></label><label>Live demo URL <small>Optional</small><input type="url" name="demo" value="{{ project.demo|default('') }}"></label><label>Status<select name="status">{% for status in ['Planned','In progress','Completed'] %}<option {% if project.status == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label><label>Screenshot / thumbnail <small>PNG, JPEG, WebP · maximum 8 MB</small><input type="file" name="image" accept="image/png,image/jpeg,image/webp"></label>{% if project.image %}<img class="thumbnail" src="{{ url_for('static',filename=project.image) }}" alt="Current project thumbnail"><label class="check"><input type="checkbox" name="remove_image">Remove current image</label>{% endif %}{% include 'admin/project_options.html' %}<label class="check"><input type="checkbox" name="published" {% if project.published %}checked{% endif %}>Publish on portfolio</label><div class="actions"><button class="primary">Save project</button><a href="{{ url_for('admin_dashboard') }}">Cancel</a></div></form>{% endblock %}
