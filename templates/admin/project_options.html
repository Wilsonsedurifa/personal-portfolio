<fieldset>
  <legend>Visibility & links</legend>
  <label>Repository visibility
    <select name="repository_visibility">
      {% for visibility in ['Public','Private'] %}
      <option {% if project.repository_visibility == visibility %}selected{% endif %}>{{ visibility }}</option>
      {% endfor %}
    </select>
  </label>
  <label class="check"><input type="checkbox" name="show_code" {% if project.show_code %}checked{% endif %}> Enable View Code (public repositories only)</label>
  <label class="check"><input type="checkbox" name="show_demo" {% if project.show_demo %}checked{% endif %}> Enable Live Demo</label>
  <label>Display order<input type="number" name="display_order" value="{{ project.display_order|default(0) }}"></label>
</fieldset>

<fieldset>
  <legend>Project images</legend>
  <p>Add up to 10 PNG, JPEG, or WebP images (8 MB total). The first image becomes the cover automatically.</p>
  <label>Gallery images
    <input type="file" name="screenshots" multiple accept="image/png,image/jpeg,image/webp" data-upload-preview>
  </label>
  <div class="upload-previews"></div>
  {% if project.screenshots|default([]) %}
  <div class="admin-gallery">
    {% for path in project.screenshots %}
    <div>
      <img class="thumbnail" src="{{ url_for('static',filename=path) }}" alt="Screenshot {{ loop.index }}">
      <label class="check"><input type="checkbox" name="remove_screenshot" value="{{ path }}"> Remove image {{ loop.index }}</label>
    </div>
    {% endfor %}
  </div>
  {% endif %}
</fieldset>
