<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Admin</title><link rel="stylesheet" href="{{ url_for('static',filename='css/admin.css') }}"></head><body><header><a href="{{ url_for('admin_dashboard') }}">WS / Portfolio Admin</a><div><a href="{{ url_for('home') }}">View portfolio ↗</a>{% if session.get('admin') %}<form action="{{ url_for('admin_logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Log out</button></form>{% endif %}</div></header><main>{% for category,message in get_flashed_messages(with_categories=true) %}<p class="notice {{ category }}" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
